name: ci

# The kernel sensor's own gates: the sensor builds everywhere, the eBPF build
# builds where clang is, the CO-RE objects build where clang is, and the
# kernel-module backend builds against generic headers.
#
# The VM proof (make vm-test) is not here: it needs a kernel image and a
# hypervisor, and a hosted runner has neither. It is the strongest check the
# project has, so it is run by hand, against the kernel that is actually
# deployed, before a release.

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly: the runner image moves, and a build that only ever ran on one
    # image is a build nobody has checked against another.
    - cron: "13 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # The current Go, not the version go.mod names. go.mod states the
          # minimum a distribution's toolchain has to satisfy, but the build
          # here should carry a fixed standard library: the 1.24 line is past
          # its support window and its net/http has a published vulnerability
          # that was only fixed in 1.26.11. The vulnerability lane says so on
          # every run otherwise.
          go-version: "stable"
          check-latest: true
          cache: true
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          # find -exec, not a quoted expansion: a quoted one hands gofmt the
          # whole list as a single filename, and it then reports every file in
          # the tree as unformatted.
          out="$(find . -name '*.go' -exec gofmt -l {} +)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      # A workflow GitHub rejects runs zero jobs, with no log to explain why:
      # the run appears as an instant failure and nothing else. This checks
      # the workflows before they are pushed, where the failure has a name.
      - name: Validate the GitHub workflows and shell commands
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build -o cau-kernel .
      - name: Smoke (inventory runs on the runner)
        run: ./cau-kernel inventory >/dev/null && ./cau-kernel posture >/dev/null

  ebpf:
    name: build BPF-LSM object + eBPF loader
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # The current Go, not the version go.mod names. go.mod states the
          # minimum a distribution's toolchain has to satisfy, but the build
          # here should carry a fixed standard library: the 1.24 line is past
          # its support window and its net/http has a published vulnerability
          # that was only fixed in 1.26.11. The vulnerability lane says so on
          # every run otherwise.
          go-version: "stable"
          check-latest: true
          cache: true
      - name: Install clang + binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang binutils
      - name: Compile and verify the BPF-LSM object
        run: make -C bpf verify
      - name: Build the eBPF-enabled binary (make sure the loader compiles)
        run: make enforce
      - name: Vet and test the eBPF build
        run: |
          go vet -tags ebpf ./...
          go test -tags ebpf ./...
      - name: "Smoke the eBPF binary (unprivileged loader must fail cleanly)"
        run: |
          ./cau-kernel version
          # Attaching needs root + BPF-LSM; unprivileged status must fail cleanly,
          # not crash. Accept a non-zero exit; fail only on a panic.
          ./cau-kernel enforce status || true

  core-bpf:
    name: build CO-RE BPF-LSM variant
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install clang + binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang binutils
      - name: Build and verify the CO-RE objects
        # The CO-RE variants are self-contained: they include only <linux/bpf.h>
        # and read kernel structs through partial declarations carrying
        # preserve_access_index, so they build with the same plain
        # `clang -target bpf` recipe as the other objects — no libbpf-dev, no
        # bpftool and no vmlinux.h generated from the runner's own kernel BTF.
        # That last dependency used to make this job fail outright on a runner
        # without kernel BTF, for an object that never needed it.
        run: make -C bpf verify-core

  kmod:
    name: build kernel-module backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kernel build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-generic
      - name: Build cau_guard.ko against the generic headers
        run: |
          # Build against the installed generic headers (a compile check that
          # does not depend on the runner's own running kernel).
          KDIR="$(find /usr/src -maxdepth 1 -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR" || { echo "no generic kernel headers found"; exit 1; }
          echo "Building against $KDIR"
          make -C kmod KDIR="$KDIR"
          test -f kmod/cau_guard.ko && echo "OK: cau_guard.ko built"

  # The untrusted-input parsers are the sensor's attack surface: the baseline
  # file, the /proc and /sys readers, the signed-baseline parser. The seed
  # corpora run as unit tests in the race lane; this is coverage-guided
  # mutation on top of them.
  fuzz:
    name: fuzz the untrusted-input parsers
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 15 }}
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '2m' || '30s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # The current Go, not the version go.mod names. go.mod states the
          # minimum a distribution's toolchain has to satisfy, but the build
          # here should carry a fixed standard library: the 1.24 line is past
          # its support window and its net/http has a published vulnerability
          # that was only fixed in 1.26.11. The vulnerability lane says so on
          # every run otherwise.
          go-version: "stable"
          check-latest: true
          cache: true
      - name: Coverage-guided hunt over every Fuzz* target
        run: make fuzz FUZZTIME="$FUZZTIME"
      - name: Publish the crasher it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**

  # The regex sweep for bug shapes is the engine's; the same tool covers this
  # tree (the engine's checkout is the tool's home, and CAU_ENGINE points at
  # it). It is a gate: a hit that is not in the baseline fails the run.
  #
  # The engine's checkout goes BESIDE this tree, not inside it — which is what
  # the Makefile's own contract says ("needs the engine checkout beside this
  # tree"). The sweep reads the tree it is pointed at: a checkout nested inside
  # this one would be swept under this tree's prefix, where the baseline does
  # not record it, and every hit in the engine would look new. The checkout
  # action refuses a path outside the workspace, so the engine is cloned where
  # the workspace cannot reach it.
  sweep:
    name: the bug-shape sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the engine beside this tree
        run: |
          # The sweep's tool and its baseline live in the engine repository.
          # The clone is shallow: the sweep needs the script, the baseline and
          # nothing else.
          git clone --depth 1 https://github.com/s-b-repo/cau.git "$RUNNER_TEMP/engine"

      - name: Run the sweep over this tree
        run: |
          # The engine's checkout is the tool's home: one sweep and one
          # baseline cover both trees, and the baseline records this tree's
          # hits under the name it has there. The target fails loudly when the
          # engine checkout is not where it says — a sweep that cannot run
          # must never pass by not running.
          make regex-audit CAU_ENGINE="$RUNNER_TEMP/engine"
