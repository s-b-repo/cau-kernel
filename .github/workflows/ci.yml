name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build -o cau-kernel .
      - name: Smoke (inventory runs on the runner)
        run: ./cau-kernel inventory >/dev/null && ./cau-kernel posture >/dev/null

  ebpf:
    name: build BPF-LSM object + eBPF loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install clang + binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang binutils
      - name: Compile and verify the BPF-LSM object
        run: make -C bpf verify
      - name: Build the eBPF-enabled binary (make sure the loader compiles)
        run: make enforce
      - name: Vet and test the eBPF build
        run: |
          go vet -tags ebpf ./...
          go test -tags ebpf ./...
      - name: "Smoke the eBPF binary (unprivileged loader must fail cleanly)"
        run: |
          ./cau-kernel version
          # Attaching needs root + BPF-LSM; unprivileged status must fail cleanly,
          # not crash. Accept a non-zero exit; fail only on a panic.
          ./cau-kernel enforce status || true

  core-bpf:
    name: build CO-RE BPF-LSM variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install clang, libbpf-dev and bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libbpf-dev binutils
          # bpftool: try the packaged dispatcher, then a generic build.
          sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic || true
      - name: Generate vmlinux.h and build the CO-RE object
        run: |
          test -r /sys/kernel/btf/vmlinux || { echo "no kernel BTF on runner"; exit 1; }
          BPFTOOL="$(command -v bpftool || true)"
          if [ -z "$BPFTOOL" ]; then BPFTOOL="$(ls /usr/lib/linux-tools/*/bpftool 2>/dev/null | head -1)"; fi
          test -n "$BPFTOOL" || { echo "bpftool not found"; exit 1; }
          echo "using bpftool: $BPFTOOL"
          "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          wc -l bpf/vmlinux.h
          make -C bpf verify-core

  kmod:
    name: build kernel-module backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kernel build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-generic
      - name: Build cau_guard.ko against the generic headers
        run: |
          # Build against the installed generic headers (a compile check that
          # does not depend on the runner's own running kernel).
          KDIR="$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null | sort -V | tail -1)"
          test -n "$KDIR" || { echo "no generic kernel headers found"; exit 1; }
          echo "Building against $KDIR"
          make -C kmod KDIR="$KDIR"
          test -f kmod/cau_guard.ko && echo "OK: cau_guard.ko built"
