name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build -o cau-kernel .
      - name: Smoke (inventory runs on the runner)
        run: ./cau-kernel inventory >/dev/null && ./cau-kernel posture >/dev/null

  ebpf:
    name: build BPF-LSM object + eBPF loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install clang + binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang binutils
      - name: Compile and verify the BPF-LSM object
        run: make -C bpf verify
      - name: Build the eBPF-enabled binary (make sure the loader compiles)
        run: make enforce
      - name: Vet and test the eBPF build
        run: |
          go vet -tags ebpf ./...
          go test -tags ebpf ./...
      - name: "Smoke the eBPF binary (unprivileged loader must fail cleanly)"
        run: |
          ./cau-kernel version
          # Attaching needs root + BPF-LSM; unprivileged status must fail cleanly,
          # not crash. Accept a non-zero exit; fail only on a panic.
          ./cau-kernel enforce status || true

  kmod:
    name: build kernel-module backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-generic
      - name: Build cau_guard.ko against the generic headers
        run: |
          # Build against the installed generic headers (a compile check that
          # does not depend on the runner's own running kernel).
          KDIR="$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null | sort -V | tail -1)"
          test -n "$KDIR" || { echo "no generic kernel headers found"; exit 1; }
          echo "Building against $KDIR"
          make -C kmod KDIR="$KDIR"
          test -f kmod/cau_guard.ko && echo "OK: cau_guard.ko built"
